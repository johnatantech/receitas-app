name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um novo push cancela a execução anterior do mesmo branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menor permissão necessária: o pipeline só lê o código
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: API (.NET) · build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache de pacotes NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar dependências
        run: dotnet restore receitas-app.slnx

      - name: Compilar
        run: dotnet build receitas-app.slnx -c Release --no-restore -warnaserror

      - name: Testar (xUnit)
        run: >
          dotnet test receitas-app.slnx -c Release --no-build
          --logger "trx;LogFileName=resultados.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-testes
          path: TestResults
          retention-days: 14

  web:
    name: Front-end (React) · lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/receitas-web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/receitas-web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (TypeScript + Vite)
        run: npm run build

  docker:
    name: Imagem Docker da API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: api

    steps:
      - uses: actions/checkout@v7

      # Garante que a imagem usada no deploy do Render continua compilando
      - name: Build da imagem
        run: docker build -t receitas-api:ci .
